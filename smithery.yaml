name: dockerfile-generator-ai-mcp
description: MCP server for dockerfile generator ai. Features generate dockerfile,
  generate compose, optimize image. From MEOK AI Labs.
version: 1.0.0
tools:
- name: generate_dockerfile
  description: Generate optimized Dockerfile for a project.
  parameters:
  - name: language
    type: string
    required: true
  - name: framework
    type: string
    required: false
  - name: requirements
    type: string
    required: false
- name: generate_compose
  description: Generate docker-compose.yml from service descriptions.
  parameters:
  - name: services
    type: string
    required: true
- name: optimize_image
  description: Suggest optimizations for a Dockerfile (layer caching, multi-stage
    builds).
  parameters:
  - name: dockerfile_content
    type: string
    required: true
- name: security_scan_hints
  description: Check Dockerfile for security best practices.
  parameters:
  - name: dockerfile_content
    type: string
    required: true
